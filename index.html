<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureFace-RX Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">SecureFace <span>-RX Web</span></div>
    <nav class="nav">
      <a href="index.html" class="active">실시간 모니터</a>
      <a href="register.html">얼굴 등록</a>
      <a href="restore.html">복원</a>
    </nav>
  </header>

  <main class="page">
    <p class="privacy-note">모든 처리는 이 브라우저 안에서만 · 영상은 전송되지 않음</p>
    <div class="notice" id="keyNotice" hidden>
      복원 키가 아직 설정되지 않아 <b>녹화하지 않습니다.</b> 화면 블러와 경고는 동작합니다.
      <a href="restore.html">복원 페이지에서 키 설정하기 →</a>
    </div>

    <section class="controls">
      <button type="button" class="btn primary" id="startCamera">카메라 시작</button>
      <label class="check"><input type="checkbox" id="showBoxes" checked> 얼굴 상자·라벨 표시</label>
    </section>

    <section class="stats">
      <div class="stat"><div class="label">상태</div><div class="value" id="statState">대기</div></div>
      <div class="stat"><div class="label">얼굴</div><div class="value" id="statFaces">0</div></div>
      <div class="stat"><div class="label">비허가자</div><div class="value danger" id="statDenied">0</div></div>
      <div class="stat"><div class="label">녹화</div><div class="value" id="statRec">꺼짐</div></div>
      <div class="stat"><div class="label">처리 속도 · 탐지/인식</div><div class="value small" id="statPerf">-</div></div>
    </section>

    <div class="layout">
      <section class="stage">
        <canvas id="view" aria-label="익명화된 영상"></canvas>
        <div class="placeholder" id="placeholder">
          <b>카메라 시작</b>을 누르세요.<br>
          얼굴은 화면에 그려지기 전에 블러 처리됩니다.
        </div>
      </section>

      <aside class="side">
        <nav class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="people" role="tab">등록자 <span id="peopleCount">0</span></button>
          <button type="button" class="tab" data-tab="events" role="tab">감지 이력</button>
        </nav>

        <div class="tab-panel" id="tab-people">
          <a class="btn primary wide" href="register.html">얼굴 등록하기 →</a>
          <ul class="list" id="peopleList"></ul>
        </div>

        <div class="tab-panel" id="tab-events" hidden>
          <div class="list-head">
            <span class="hint">최근 50건</span>
            <button type="button" class="btn small" id="clearEvents">이력 지우기</button>
          </div>
          <ul class="list" id="eventList"></ul>
        </div>
      </aside>
    </div>
    <p class="error" id="error" role="alert"></p>
  </main>

  <!-- 비허가자 감지 경고: 바깥 클릭·Esc로는 닫히지 않고 확인 버튼으로만 닫힌다 -->
  <div class="alert-overlay" id="alertOverlay" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" hidden>
    <div class="alert-box">
      <div class="alert-icon" aria-hidden="true">!</div>
      <div class="alert-title" id="alertTitle">비허가자 감지</div>
      <div class="alert-count" id="alertCount"></div>
      <div class="alert-reason" id="alertReason"></div>
      <div class="alert-time" id="alertTime"></div>
      <button type="button" class="alert-confirm" id="alertConfirm">확인</button>
    </div>
  </div>

  <!-- 원본 영상은 화면에 표시하지 않는다. 캔버스에는 익명화된 프레임만 그린다. -->
  <video id="source" muted playsinline hidden></video>
  <script type="module" src="js/app.js"></script>
</body>
</html>
